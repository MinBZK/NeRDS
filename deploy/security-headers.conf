# A separate file because nginx does not inherit add_header: a location with
# its own add_header loses those of the server block, so each location
# includes this file.

# No 'preload': that registers the whole overheid.nl domain and belongs to the
# domain owner.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Everything comes from the site itself. style-src needs 'unsafe-inline': the
# design system injects a <style> into its shadow roots at runtime
# (hide-below/hide-above). Scripts stay strictly on 'self'. The one external
# image is the status label of the accessibility statement.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://www.toegankelijkheidsverklaring.nl; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
