description:
  nl:
    shortDescription: >-
      Richtlijnen en praktische hulpmiddelen voor het verantwoord ontwerpen,
      ontwikkelen en inkopen van digitale systemen bij de overheid.
    longDescription: >-
      De Nederlandse Richtlijn Digitale Systemen (NeRDS) is een set
      standaarden, richtlijnen en praktische hulpmiddelen voor het verantwoord
      ontwerpen, ontwikkelen en inkopen van digitale systemen binnen de
      Nederlandse overheid. De Nederlandse Digitale Dienst ontwikkelt de
      richtlijn in het open op GitHub, zodat iedereen kan meelezen en een
      wijziging kan voorstellen.

      De inhoud staat in Markdown-bestanden in de map docs. MkDocs maakt
      daar een website van, vormgegeven met het NLDD Designsysteem in de
      Rijkshuisstijl. Elke pull request wordt getest op toegankelijkheid
      tegen WCAG 2.1 AA. De repository levert de richtlijnen ook als skills
      voor AI-assistenten zoals Claude Code en Cursor.
    features:
      - Richtlijnen met bewezen praktijken per fase
      - Website in de Rijkshuisstijl
      - Skills voor AI-assistenten
      - Geautomatiseerde toegankelijkheidstest

