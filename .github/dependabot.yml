version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    # release-please reads the titles on main; an update is maintenance.
    commit-message:
      prefix: "chore"
    reviewers:
      - "anneschuth"
    groups:
      all-github-actions:
        patterns:
          - "*"

  # The nginx base image of the website, in deploy/Dockerfile.
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    # release-please reads the titles on main; an update is maintenance.
    commit-message:
      prefix: "chore"
    reviewers:
      - "anneschuth"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "10:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 5
    # release-please reads the titles on main; an update is maintenance.
    commit-message:
      prefix: "chore"
    reviewers:
      - "anneschuth"
    groups:
      all-pip-packages:
        patterns:
          - "*"
