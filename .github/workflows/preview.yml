name: Deploy PR preview
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

# De preview komt op de branch gh-pages en de link in een reactie op de PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    name: deploy PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: get tag
        id: get_commit_hash
        run: |
          echo "commit_hash=$(git describe --tags)" >> "$GITHUB_OUTPUT"

      - name: inject version
        run: |
          sed -i 's/development/${{ steps.get_commit_hash.outputs.commit_hash }}/g' docs/version.md

      - name: Add url
        run: |
          echo "site_url: https://nederlandsedigitaledienst.github.io/NeRDS/pr-preview/pr-${{github.event.number}}" >> mkdocs.yml

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        if: github.event.action != 'closed'

      - name: build preview
        if: github.event.action != 'closed'
        run: uv run --locked mkdocs build

      - name: Controleer de website tegen het designsysteem
        if: github.event.action != 'closed'
        run: |
          uv run --locked python scripts/check_nldd.py ./site
          uv run --locked python scripts/behavior_surface.py check ./site scripts/behavior-surface.json

      - uses: actions/upload-artifact@v7
        if: github.event.action != 'closed'
        with:
          name: NeRDSWebsite-${{github.event.number}}
          path: ./site/

      - name: Deploy preview
        if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./site/
