---
# Default state for all rules
default: true

# Disable line length check (MD013)
MD013: false

# The same heading may return under another parent: every phase has its own
# "Gewenste uitkomsten"
MD024:
  siblings_only: true

# Allow multiple h1 headings
MD025: false

# Allow inline HTML
MD033: false

# Don't require consistent ordered list numbering
MD029: false

# Allow emphasis with underscore
MD036: false

# Don't enforce first line in file should be a top level heading
MD041: false

# Allow blank lines inside blockquotes
MD028: false
