<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeRDS: Nederlandse Richtlijn Digitale Systemen 0.1</title>
  <meta name="description" content="De Nederlandse Richtlijn Digitale Systemen van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties">
  <link rel="icon" type="image/svg+xml" href="/NeRDS/assets/nldd/favicon.svg">
  <link rel="apple-touch-icon" href="/NeRDS/assets/nldd/touch-icon.png">
  <link rel="stylesheet" href="/NeRDS/assets/nldd/nldd.css">
  <link rel="stylesheet" href="/NeRDS/assets/site.css">
  <script defer src="/NeRDS/assets/nldd/nldd.min.js"></script>
  <script>var base_url = "/NeRDS/";</script>
  <script defer src="/NeRDS/assets/site.js"></script>
  <script defer src="/NeRDS/assets/search.js"></script>
  <script defer src="/NeRDS/assets/feedback.js"></script>
</head>
<body>
<nldd-app-view>
  <nldd-page>
    <nldd-skip-link slot="header">
  <nldd-top-navigation-bar
    logo-title="Ministerie van Binnenlandse Zaken en Koninkrijksrelaties"
    logo-href="/NeRDS/."
    website-title="Nederlandse Richtlijn Digitale Systemen"
    website-href="/NeRDS/."
  >
    <nldd-menu-bar slot="global">
      <nldd-menu-bar-item text="Home" href="/NeRDS/."></nldd-menu-bar-item>
      <nldd-menu-bar-item text="Richtlijnen" href="/NeRDS/richtlijnen/"></nldd-menu-bar-item>
      <nldd-menu-bar-item text="Over NeRDS" href="/NeRDS/Over-NeRDS/"></nldd-menu-bar-item>
    </nldd-menu-bar>
    <nldd-menu-bar slot="utility">
      <nldd-menu-bar-item id="search-open" text="Zoeken" icon="search" content-priority="icon" haspopup="dialog"></nldd-menu-bar-item>
      <nldd-menu-bar-item id="feedback-open" text="Feedback" icon="message-rectangle-text" content-priority="icon" haspopup="dialog"></nldd-menu-bar-item>
      <nldd-menu-bar-item text="GitHub" icon="git-branch" content-priority="icon" href="https://github.com/MinBZK/NeRDS"></nldd-menu-bar-item>
    </nldd-menu-bar>
  </nldd-top-navigation-bar>
</nldd-skip-link>
    <noscript>
      <nldd-rich-text>
        <p>Deze website werkt het best met JavaScript. Zonder JavaScript navigeer je met deze links:</p>
        <ul>
          <li><a href="/NeRDS/.">Home</a></li>
          <li><a href="/NeRDS/richtlijnen/">Richtlijnen</a></li>
          <li><a href="/NeRDS/Over-NeRDS/">Over NeRDS</a></li>
        </ul>
      </nldd-rich-text>
    </noscript>
<nldd-simple-section>
  <nldd-inline-dialog
    size="lg"
    icon="signpost"
    heading-level="1"
    text="Deze pagina bestaat niet"
    supporting-text="De pagina is verplaatst of verwijderd, of het adres klopt niet."
  >
    <nldd-button slot="actions" variant="primary" href="/NeRDS/." text="Naar de startpagina"></nldd-button>
  </nldd-inline-dialog>
</nldd-simple-section>


    <nldd-page-footer slot="footer">
  <nldd-container layout="grid" padding-block="24" gap="24">
    <nldd-container gap="8">
      <nldd-title size="5" heading-level="2" text="Over deze site"></nldd-title>
      <nldd-link size="sm" href="/NeRDS/Over-NeRDS/" text="Over NeRDS"></nldd-link>
      <nldd-link size="sm" href="/NeRDS/Over-NeRDS/CONTRIBUTING/#ik-heb-een-vraag" text="Contact"></nldd-link>
      <nldd-link size="sm" href="https://github.com/MinBZK/NeRDS/releases" target="_blank" end-icon="external-link" text="Releasenotes op GitHub"></nldd-link>
    </nldd-container>
    <nldd-container gap="8">
      <nldd-title size="5" heading-level="2" text="Service"></nldd-title>
      <nldd-link size="sm" href="/NeRDS/Over-NeRDS/copyright/" text="Copyright"></nldd-link>
      <nldd-link size="sm" href="/NeRDS/Over-NeRDS/kwetsbaarheid-melden/" text="Kwetsbaarheid melden"></nldd-link>
    </nldd-container>
    <nldd-container gap="8">
      <nldd-title size="5" heading-level="2" text="Overheid"></nldd-title>
      <nldd-link size="sm" href="https://overheid.nl/" target="_blank" end-icon="external-link" text="Overheid.nl"></nldd-link>
      <nldd-link size="sm" href="https://www.rijksoverheid.nl/" target="_blank" end-icon="external-link" text="Rijksoverheid.nl"></nldd-link>
      <nldd-link size="sm" href="https://www.digitaleoverheid.nl/" target="_blank" end-icon="external-link" text="Digitale Overheid"></nldd-link>
    </nldd-container>
  </nldd-container>
  <nldd-page-footer-legal-bar slot="legal-bar">
    <nldd-page-footer-legal-bar-item slot="start" text="Ministerie van Binnenlandse Zaken en Koninkrijksrelaties"></nldd-page-footer-legal-bar-item>
    <nldd-page-footer-legal-bar-item slot="end" href="/NeRDS/Over-NeRDS/privacy/" text="Privacy"></nldd-page-footer-legal-bar-item>
    <nldd-page-footer-legal-bar-item slot="end" href="/NeRDS/Over-NeRDS/cookies/" text="Cookies"></nldd-page-footer-legal-bar-item>
    <nldd-page-footer-legal-bar-item slot="end" href="/NeRDS/Over-NeRDS/toegankelijkheid/" text="Toegankelijkheid"></nldd-page-footer-legal-bar-item>
  </nldd-page-footer-legal-bar>
</nldd-page-footer>
  </nldd-page>
</nldd-app-view>
<nldd-sheet id="search-sheet" placement="right" width="480px">
  <nldd-page>
    <nldd-top-title-bar slot="header" text="Zoeken" heading-level="2" dismiss-text="Sluit"></nldd-top-title-bar>
    <nldd-container padding="16" gap="16">
      <nldd-search-field id="search-query" name="query" placeholder="Zoek in de NeRDS"></nldd-search-field>
      <nldd-list id="search-results" variant="box-tinted" accessible-label="Zoekresultaten">
        <nldd-inline-dialog slot="empty" icon="search" text="Typ om te zoeken" supporting-text="Je zoekt in alle richtlijnen en pagina's."></nldd-inline-dialog>
      </nldd-list>
    </nldd-container>
  </nldd-page>
</nldd-sheet>
<nldd-sheet id="feedback-sheet" placement="right" width="480px">
  <nldd-page>
    <nldd-top-title-bar slot="header" text="Feedback geven" heading-level="2" dismiss-text="Sluit"></nldd-top-title-bar>
    <nldd-container padding="16" gap="16">
      <nldd-rich-text>
        <p>Helpt u ons door uw feedback te delen? We gebruiken dit om NeRDS te verbeteren. U kunt feedback geven via e-mail of via GitHub Issues.</p>
      </nldd-rich-text>
      <nldd-banner id="feedback-success" variant="success" text="Bedankt voor uw feedback!" hidden></nldd-banner>
      <nldd-form id="feedback-form">
        <nldd-form-field label="Welke richtlijn betreft dit?" optional>
          <nldd-dropdown>
            <select id="feedback-guideline" name="feedback_guideline">
              <option value="">Alle richtlijnen</option>
              <option value="0">Over de NeRDS in het algemeen</option>
              <option value="1" data-slug="gebruikersbehoeften">1. Gebruikersbehoeften</option>
              <option value="2" data-slug="toegankelijkheid">2. Toegankelijkheid</option>
              <option value="3" data-slug="open-source">3. Open Source</option>
              <option value="4" data-slug="open-standaarden">4. Open Standaarden</option>
              <option value="5" data-slug="cloud">5. Cloud</option>
              <option value="6" data-slug="veiligheid">6. Veiligheid</option>
              <option value="7" data-slug="privacy">7. Privacy</option>
              <option value="8" data-slug="samenwerking">8. Samenwerking</option>
              <option value="9" data-slug="integratie">9. Integratie</option>
              <option value="10" data-slug="data">10. Data</option>
              <option value="11" data-slug="algoritmen">11. Algoritmen</option>
              <option value="12" data-slug="inkoop">12. Inkoopstrategie</option>
              <option value="13" data-slug="duurzaamheid">13. Duurzaamheid</option>
            </select>
          </nldd-dropdown>
        </nldd-form-field>
        <nldd-form-field label="Soort feedback">
          <nldd-dropdown>
            <select id="feedback-type" name="feedback_type" required>
              <option value="">Selecteer</option>
              <option value="bug_report">Fout</option>
              <option value="feature_request">Voorstel</option>
              <option value="general_feedback">Feedback</option>
              <option value="question">Vraag</option>
            </select>
          </nldd-dropdown>
          <nldd-validation-list>
            <nldd-validation-item id="feedback-type-required" required>Een soort feedback is nodig.</nldd-validation-item>
          </nldd-validation-list>
        </nldd-form-field>
        <nldd-form-field label="Uw feedback">
          <nldd-multi-line-text-field id="feedback-text" name="feedback_text" rows="4" required minlength="10" maxlength="5000"></nldd-multi-line-text-field>
          <nldd-validation-list>
            <nldd-validation-item id="feedback-text-minlength" minlength="10" required>Minimaal 10 tekens.</nldd-validation-item>
            <nldd-validation-item id="feedback-text-maxlength" maxlength="5000">Maximaal 5000 tekens.</nldd-validation-item>
          </nldd-validation-list>
        </nldd-form-field>
        <div id="feedback-related-docs-container">
          <nldd-form-field label="Link naar een relevant document" optional>
            <nldd-text-field type="url" name="related_docs[]" placeholder="nerds.nl/..."></nldd-text-field>
          </nldd-form-field>
        </div>
        <nldd-button id="feedback-add-link" variant="neutral-tinted" size="sm" start-icon="plus" text="Link toevoegen"></nldd-button>
        <nldd-form-actions>
          <nldd-button-group>
            <nldd-button id="feedback-submit" variant="primary" type="submit" text="Via e-mail"></nldd-button>
            <nldd-button id="feedback-github" variant="secondary" text="Via GitHub Issues"></nldd-button>
          </nldd-button-group>
        </nldd-form-actions>
      </nldd-form>
    </nldd-container>
  </nldd-page>
</nldd-sheet>
</body>
</html>
